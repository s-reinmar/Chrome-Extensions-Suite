<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pobieracz v1.5</title>
    <link rel="stylesheet" href="css/popup.css">
</head>
<body>
    <div class="app-header-title">
        <span>📦 Pobieracz v1.6 (Aktywna Karta)</span>
    </div>
    
    <div class="header">
        <div class="filter-row" id="width-filter">
            <span class="filter-label">Width:</span>
            <span class="val-display val-display-left min-val">0px</span>
            <div class="slider-container">
                <div class="slider-track"></div>
                <div class="slider-range"></div>
                <input type="range" class="min-input" min="0" max="3000" step="10" value="0">
                <input type="range" class="max-input" min="0" max="3000" step="10" value="3000">
            </div>
            <span class="val-display max-val">3000px</span>
        </div>
        <div class="filter-row" id="height-filter">
            <span class="filter-label">Height:</span>
            <span class="val-display val-display-left min-val">0px</span>
            <div class="slider-container">
                <div class="slider-track"></div>
                <div class="slider-range"></div>
                <input type="range" class="min-input" min="0" max="3000" step="10" value="0">
                <input type="range" class="max-input" min="0" max="3000" step="10" value="3000">
            </div>
            <span class="val-display max-val">3000px</span>
        </div>
        
        <div class="stats-bar">
            <div class="stat-badge matching"><span id="stat-matching">0 matching</span></div>
            <div class="stat-badge filtered"><span id="stat-filtered">0 filtered out</span></div>
            <label class="stat-badge">
                <input type="checkbox" id="select-all-cb" checked>
                <span id="stat-selected">0 selected</span>
            </label>
        </div>
    </div>
    
    <div class="gallery-container" id="gallery"></div>

    <div class="status-bar-container">
        <div class="status-message">
            <span id="status-text">Gotowy do pracy</span>
            <span id="progress-percent">100%</span>
        </div>
        <div class="progress-bar-track">
            <div id="progress-fill" class="progress-bar-fill" style="width: 100%;"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <input type="text" id="subfolder" placeholder="Katalog (np. blue)">
        <select id="format" style="flex: 0.5;">
            <option value="original">Oryginalny</option>
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
        </select>
        <button id="download-btn" disabled>Download</button>
    </div>

    <!-- W sekcji .bottom-bar dodaj przycisk: -->
<button id="open-meta-btn" class="meta-config-btn" title="Ustawienia metadanych (Tytuł, Tagi, Autorzy)">Metadane</button>

<!-- Na końcu pliku przed </body> dodaj HTML modalu: -->
<div id="meta-modal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <span>Ustawienia Szczegółów Pliku (Metadane Windows)</span>
        </div>
        <div class="modal-body">
            <!-- Opis -->
            <div class="modal-field">
                <label for="meta-title">Tytuł</label>
                <input type="text" id="meta-title" placeholder="np. Girl Power">
            </div>
            <div class="modal-field">
                <label for="meta-rating">Klasyfikacja (0-5 gwiazdek)</label>
                <select id="meta-rating">
                    <option value="0">0 gwiazdek (Brak)</option>
                    <option value="1">★☆☆☆☆ (1 gwiazdka)</option>
                    <option value="2">★★☆☆☆ (2 gwiazdki)</option>
                    <option value="3">★★★☆☆ (3 gwiazdki)</option>
                    <option value="4">★★★★☆ (4 gwiazdki)</option>
                    <option value="5">★★★★★ (5 gwiazdek)</option>
                </select>
            </div>
            <div class="modal-field">
                <label for="meta-tags">Tagi (oddzielone przecinkami)</label>
                <input type="text" id="meta-tags" placeholder="np. Lineal, ikona, projekt">
            </div>
            <div class="modal-field">
                <label for="meta-comments">Komentarze</label>
                <input type="text" id="meta-comments" placeholder="Wpisz komentarz">
            </div>

            <!-- Pochodzenie -->
            <div class="modal-field">
                <label for="meta-authors">Autorzy</label>
                <input type="text" id="meta-authors" placeholder="np. Smashicons">
            </div>
            <div class="modal-row-two">
                <div class="modal-field">
                    <label for="meta-date-taken">Data wykonania</label>
                    <input type="date" id="meta-date-taken">
                </div>
                <div class="modal-field">
                    <label for="meta-date-acquired">Data pozyskania</label>
                    <input type="date" id="meta-date-acquired">
                </div>
            </div>
            <div class="modal-field">
                <label for="meta-software">Nazwa programu</label>
                <input type="text" id="meta-software" placeholder="np. Photoshop / WebDownloader">
            </div>
            <div class="modal-field">
                <label for="meta-copyright">Prawa autorskie</label>
                <input type="text" id="meta-copyright" placeholder="np. © 2026 Wszelkie prawa zastrzeżone">
            </div>
        </div>
        <div class="modal-footer">
            <button id="meta-cancel-btn" class="btn-secondary">Anuluj</button>
            <button id="meta-save-btn" class="btn-primary">Zapisz</button>
        </div>
    </div>
</div>

    <script src="js/popup.js"></script>

</body>
</html>
