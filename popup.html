<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pobieracz v1.5</title>
    <link rel="stylesheet" href="css/popup.css">
</head>
<body>
    <div class="app-header-title">
        <span>📦 Pobieracz v1.5 (Aktywna Karta)</span>
    </div>
    
    <div class="header">
        <div class="filter-row" id="width-filter">
            <span class="filter-label">Width:</span>
            <span class="val-display val-display-left min-val">0px</span>
            <div class="slider-container">
                <div class="slider-track"></div>
                <div class="slider-range"></div>
                <input type="range" class="min-input" min="0" max="3000" step="10" value="0">
                <input type="range" class="max-input" min="0" max="3000" step="10" value="3000">
            </div>
            <span class="val-display max-val">3000px</span>
        </div>
        <div class="filter-row" id="height-filter">
            <span class="filter-label">Height:</span>
            <span class="val-display val-display-left min-val">0px</span>
            <div class="slider-container">
                <div class="slider-track"></div>
                <div class="slider-range"></div>
                <input type="range" class="min-input" min="0" max="3000" step="10" value="0">
                <input type="range" class="max-input" min="0" max="3000" step="10" value="3000">
            </div>
            <span class="val-display max-val">3000px</span>
        </div>
        
        <div class="stats-bar">
            <div class="stat-badge matching"><span id="stat-matching">0 matching</span></div>
            <div class="stat-badge filtered"><span id="stat-filtered">0 filtered out</span></div>
            <label class="stat-badge">
                <input type="checkbox" id="select-all-cb" checked>
                <span id="stat-selected">0 selected</span>
            </label>
        </div>
    </div>
    
    <div class="gallery-container" id="gallery"></div>

    <div class="status-bar-container">
        <div class="status-message">
            <span id="status-text">Gotowy do pracy</span>
            <span id="progress-percent">100%</span>
        </div>
        <div class="progress-bar-track">
            <div id="progress-fill" class="progress-bar-fill" style="width: 100%;"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <input type="text" id="subfolder" placeholder="Katalog (np. blue)">
        <select id="format" style="flex: 0.5;">
            <option value="original">Oryginalny</option>
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
        </select>
        <button id="download-btn" disabled>Download</button>
    </div>

    <script src="js/popup.js"></script>
</body>
</html>
